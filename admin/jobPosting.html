<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Manage Job Postings | Human Appeal Pakistan Admin
</title>
<link rel="icon" type="image/x-icon" href="../images/logo.ico">
<link rel="stylesheet" href="../css/styles.css">

</head>


<body
class="admin-body"
data-permission="manage_jobs">


<!-- ========================================= -->
<!-- ADMIN NAVIGATION -->
<!-- ========================================= -->

<div class="admin-nav">

    <div class="container admin-nav-container">

        <h2 style="color:#FFFFFF;font-size:1.4rem;">
            Administrative Portal
        </h2>


        <div
        style="display:flex;align-items:center;gap:15px;color:#FFFFFF;">

            <div
            style="text-align:right;line-height:1.3;">

                <div
                id="current-user-name"
                style="font-weight:600;">
                </div>

                <div
                id="current-user-role"
                style="font-size:0.75rem;opacity:0.75;">
                </div>

            </div>


            <button
            onclick="adminLogout()"
            class="btn btn-primary">

                Logout

            </button>

        </div>

    </div>

</div>



<!-- ========================================= -->
<!-- MAIN -->
<!-- ========================================= -->

<main class="container">

    <div class="admin-dashboard-layout">


        <!-- SIDEBAR -->

        <aside class="admin-sidebar">

            <div id="admin-sidebar-menu-holder"></div>

        </aside>



        <!-- CONTENT -->

        <section class="admin-main">


            <h2>
                Manage Job Postings
            </h2>


            <!-- ACTION BAR -->

            <div class="admin-actions-bar">


                <input
                id="search-input"
                class="form-control"
                placeholder="Search job postings...">


                <button
                id="btn-add-job"
                class="btn btn-secondary">

                    Add New Job

                </button>


            </div>



            <!-- TABLE -->

            <div class="table-responsive">

                <table class="admin-table">

                    <thead>

                        <tr>

                            <th>Title</th>

                            <th>Reference</th>

                            <th>Department</th>

                            <th>Location</th>

                            <th>Employment</th>

                            <th>Status</th>

                            <th>Featured</th>

                            <th>Opening</th>

                            <th>Closing</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="table-body">

                    </tbody>

                </table>

            </div>


        </section>

    </div>

</main>



<!-- ========================================= -->
<!-- JOB MODAL -->
<!-- ========================================= -->

<div
class="modal-backdrop"
id="job-modal">


    <div class="modal-content">


        <div class="modal-header">


            <h3 id="modal-title">
                Add Job Posting
            </h3>


            <button
            id="modal-close-x">

                X

            </button>


        </div>



        <form id="job-form">


            <!-- TITLE -->

            <div class="form-group">

                <label>
                    Title
                </label>

                <input
                id="form-title"
                class="form-control"
                required>

            </div>



            <!-- SLUG -->

            <div class="form-group">

                <label>
                    Slug
                </label>

                <input
                id="form-slug"
                class="form-control"
                required>

            </div>



            <!-- REFERENCE -->

            <div class="form-group">

                <label>
                    Reference No.
                </label>

                <input
                id="form-reference-no"
                class="form-control">

            </div>



            <!-- DEPARTMENT -->

            <div class="form-group">

                <label>
                    Department
                </label>

                <input
                id="form-department"
                class="form-control">

            </div>



            <!-- LOCATION -->

            <div class="form-group">

                <label>
                    Location
                </label>

                <input
                id="form-location"
                class="form-control">

            </div>



            <!-- EMPLOYMENT TYPE -->

            <div class="form-group">

                <label>
                    Employment Type
                </label>

                <select
                id="form-employment-type"
                class="form-control">

                    <option value="">
                        Select Employment Type
                    </option>

                    <option value="Full Time">
                        Full Time
                    </option>

                    <option value="Part Time">
                        Part Time
                    </option>

                    <option value="Contract">
                        Contract
                    </option>

                    <option value="Internship">
                        Internship
                    </option>

                </select>

            </div>



            <!-- STATUS -->

            <div class="form-group">

                <label>
                    Status
                </label>

                <select
                id="form-status"
                class="form-control">

                    <option value="draft">
                        Draft
                    </option>

                    <option value="published">
                        Published
                    </option>

                    <option value="closed">
                        Closed
                    </option>

                </select>

            </div>



            <!-- FEATURED -->

            <div class="form-group">

                <label>

                    <input
                    type="checkbox"
                    id="form-featured">

                    Featured Job

                </label>

            </div>



            <!-- OPENING DATE -->

            <div class="form-group">

                <label>
                    Opening Date
                </label>

                <input
                type="date"
                id="form-opening-date"
                class="form-control">

            </div>



            <!-- CLOSING DATE -->

            <div class="form-group">

                <label>
                    Closing Date
                </label>

                <input
                type="date"
                id="form-closing-date"
                class="form-control">

            </div>



            <!-- APPLICATION URL -->

            <div class="form-group">

                <label>
                    Application URL
                </label>

                <input
                type="url"
                id="form-application-url"
                class="form-control">

            </div>



            <!-- APPLICATION EMAIL -->

            <div class="form-group">

                <label>
                    Application Email
                </label>

                <input
                type="email"
                id="form-application-email"
                class="form-control">

            </div>



            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                id="form-description"
                class="form-control"
                rows="5"></textarea>

            </div>



            <!-- REQUIREMENTS -->

            <div class="form-group">

                <label>
                    Requirements
                </label>

                <textarea
                id="form-requirements"
                class="form-control"
                rows="5"></textarea>

            </div>



            <!-- FOOTER -->

            <div class="modal-footer">


                <button
                type="button"
                id="btn-cancel-form"
                class="btn btn-outline">

                    Cancel

                </button>


                <button
                type="submit"
                class="btn btn-secondary">

                    Save

                </button>


            </div>


        </form>

    </div>

</div>



<!-- ========================================= -->
<!-- EXISTING ADMIN SCRIPTS -->
<!-- ========================================= -->
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>

<script src="../js/admin-common.js"></script>

<script src="../js/authGuard.js"></script>

<script src="../js/permissionGuard.js"></script>

<script src="../js/permissionUI.js"></script>



<script>


const currentUser =
AuthAPI.requireLogin("./login.html");


let jobPostings = [];

let editId = null;



// ============================================
// INITIALIZE
// ============================================

(async function(){

    if(!currentUser)
        return;


    document.getElementById(
        "current-user-name"
    ).innerText =
        currentUser.name;


    document.getElementById(
        "current-user-role"
    ).innerText =
        currentUser.role;


    renderAdminSidebar(
        currentUser,
        "job-postings.html"
    );


    await loadJobPostings();

})();



// ============================================
// LOAD JOB POSTINGS
// ============================================

async function loadJobPostings(){

    try{

        const response =
            await API.get("/job-postings");


        console.log(
            "FULL JOB POSTINGS RESPONSE:",
            response
        );


        jobPostings =
            response.jobPostings || [];


        console.log(
            "JOB POSTINGS ARRAY:",
            jobPostings
        );


        renderJobPostings();

    }
    catch(error){

        console.error(
            "Load Job Postings Error:",
            error
        );


        showToast(
            error.message ||
            "Unable to load job postings",
            "error"
        );

    }

}



// ============================================
// RENDER JOB POSTINGS
// ============================================

function renderJobPostings(){

    const search =
        document
        .getElementById("search-input")
        .value
        .toLowerCase()
        .trim();


    let list =
        jobPostings;


    if(search){

        list =
            jobPostings.filter(job =>

                (job.title || "")
                .toLowerCase()
                .includes(search)

                ||

                (job.reference_no || "")
                .toLowerCase()
                .includes(search)

                ||

                (job.department || "")
                .toLowerCase()
                .includes(search)

                ||

                (job.location || "")
                .toLowerCase()
                .includes(search)

            );

    }



    const tbody =
        document.getElementById(
            "table-body"
        );


    if(list.length === 0){

        tbody.innerHTML = `

            <tr>

                <td
                colspan="10"
                style="text-align:center">

                    No job postings found

                </td>

            </tr>

        `;

        return;

    }



    tbody.innerHTML =
        list.map(job => `

            <tr>

                <td>
                    ${escapeHtml(job.title)}
                </td>

                <td>
                    ${escapeHtml(
                        job.reference_no || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        job.department || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        job.location || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        job.employment_type || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        job.status || "-"
                    )}
                </td>

                <td>
                    ${job.featured ? "Yes" : "No"}
                </td>

                <td>
                    ${formatDate(job.opening_date)}
                </td>

                <td>
                    ${formatDate(job.closing_date)}
                </td>

                <td>

                    <button
                    onclick="editJob(${job.id})">

                        Edit

                    </button>


                    <button
                    onclick="deleteJob(${job.id})">

                        Delete

                    </button>

                </td>

            </tr>

        `).join("");

}



// ============================================
// SEARCH
// ============================================

document
.getElementById("search-input")
.addEventListener(
    "input",
    renderJobPostings
);



// ============================================
// OPEN ADD MODAL
// ============================================

document
.getElementById("btn-add-job")
.addEventListener(
    "click",
    function(){

        openModal();

    }
);



// ============================================
// OPEN MODAL
// ============================================

function openModal(job = null){

    document
    .getElementById("job-form")
    .reset();


    if(job){

        editId =
            job.id;


        document
        .getElementById("modal-title")
        .innerText =
            "Edit Job Posting";


        document
        .getElementById("form-title")
        .value =
            job.title || "";


        document
        .getElementById("form-slug")
        .value =
            job.slug || "";


        document
        .getElementById("form-reference-no")
        .value =
            job.reference_no || "";


        document
        .getElementById("form-department")
        .value =
            job.department || "";


        document
        .getElementById("form-location")
        .value =
            job.location || "";


        document
        .getElementById("form-employment-type")
        .value =
            job.employment_type || "";


        document
        .getElementById("form-status")
        .value =
            job.status || "draft";


        document
        .getElementById("form-featured")
        .checked =
            Boolean(job.featured);


        document
        .getElementById("form-opening-date")
        .value =
            formatDateForInput(
                job.opening_date
            );


        document
        .getElementById("form-closing-date")
        .value =
            formatDateForInput(
                job.closing_date
            );


        document
        .getElementById("form-application-url")
        .value =
            job.application_url || "";


        document
        .getElementById("form-application-email")
        .value =
            job.application_email || "";


        document
        .getElementById("form-description")
        .value =
            job.description || "";


        document
        .getElementById("form-requirements")
        .value =
            job.requirements || "";

    }
    else{

        editId = null;


        document
        .getElementById("modal-title")
        .innerText =
            "Add Job Posting";

    }


    document
    .getElementById("job-modal")
    .classList
    .add("show");

}



// ============================================
// CLOSE MODAL
// ============================================

function closeModal(){

    document
    .getElementById("job-modal")
    .classList
    .remove("show");

}


document
.getElementById("modal-close-x")
.onclick =
    closeModal;


document
.getElementById("btn-cancel-form")
.onclick =
    closeModal;



// ============================================
// SAVE JOB
// ============================================

document
.getElementById("job-form")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const data = {

            title:
                document
                .getElementById("form-title")
                .value
                .trim(),


            slug:
                document
                .getElementById("form-slug")
                .value
                .trim(),


            reference_no:
                document
                .getElementById(
                    "form-reference-no"
                )
                .value
                .trim(),


            department:
                document
                .getElementById(
                    "form-department"
                )
                .value
                .trim(),


            location:
                document
                .getElementById(
                    "form-location"
                )
                .value
                .trim(),


            employment_type:
                document
                .getElementById(
                    "form-employment-type"
                )
                .value,


            description:
                document
                .getElementById(
                    "form-description"
                )
                .value
                .trim(),


            requirements:
                document
                .getElementById(
                    "form-requirements"
                )
                .value
                .trim(),


            application_url:
                document
                .getElementById(
                    "form-application-url"
                )
                .value
                .trim(),


            application_email:
                document
                .getElementById(
                    "form-application-email"
                )
                .value
                .trim(),


            status:
                document
                .getElementById(
                    "form-status"
                )
                .value,


            featured:
                document
                .getElementById(
                    "form-featured"
                )
                .checked
                ? 1
                : 0,


            opening_date:
                document
                .getElementById(
                    "form-opening-date"
                )
                .value ||
                null,


            closing_date:
                document
                .getElementById(
                    "form-closing-date"
                )
                .value ||
                null,


            published_at:
                null

        };


        console.log(
            "Sending job:",
            data
        );


        try{

            if(editId){

                await API.put(
                    "/job-postings/" +
                    editId,
                    data
                );

            }
            else{

                await API.post(
                    "/job-postings",
                    data
                );

            }


            closeModal();


            await loadJobPostings();


            showToast(
                editId
                ? "Job posting updated successfully"
                : "Job posting created successfully",
                "success"
            );


        }
        catch(error){

            console.error(error);


            showToast(
                error.message ||
                "Save failed",
                "error"
            );

        }

    }
);



// ============================================
// EDIT JOB
// ============================================

window.editJob =
function(id){

    const job =
        jobPostings.find(
            j => j.id === id
        );


    if(job){

        openModal(job);

    }

};



// ============================================
// DELETE JOB
// ============================================

window.deleteJob =
async function(id){

    if(!confirm(
        "Delete this job posting?"
    ))
        return;


    try{

        await API.delete(
            "/job-postings/" +
            id
        );


        await loadJobPostings();


        showToast(
            "Job posting deleted",
            "success"
        );

    }
    catch(error){

        console.error(error);


        showToast(
            error.message ||
            "Delete failed",
            "error"
        );

    }

};



// ============================================
// DATE FORMAT
// ============================================

function formatDate(date){

    if(!date)
        return "-";


    const parsed =
        new Date(date);


    if(
        Number.isNaN(
            parsed.getTime()
        )
    )
        return "-";


    return parsed.toLocaleDateString();

}



// ============================================
// DATE FOR INPUT
// ============================================

function formatDateForInput(date){

    if(!date)
        return "";


    const parsed =
        new Date(date);


    if(
        Number.isNaN(
            parsed.getTime()
        )
    )
        return "";


    const year =
        parsed.getFullYear();


    const month =
        String(
            parsed.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            parsed.getDate()
        ).padStart(2, "0");


    return `${year}-${month}-${day}`;

}



// ============================================
// HTML ESCAPE
// ============================================

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    )
        return "";


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ============================================
// LOGOUT
// ============================================

function adminLogout(){

    AuthAPI.logout();

}


</script>


</body>

</html>
