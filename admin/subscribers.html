<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Subscribers | Human Appeal Pakistan Admin</title>

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" type="image/x-icon" href="../images/logo.ico">
</head>

<body class="admin-body" data-permission="manage_subscribers">

  <!-- =========================
       ADMIN NAVBAR
  ========================== -->

  <div class="admin-nav">

    <div class="container admin-nav-container">

      <h2 style="color:#FFFFFF; font-size:1.4rem;">
        Administrative Portal
      </h2>

      <div
        style="
          display:flex;
          align-items:center;
          gap:15px;
          color:#FFFFFF;
        "
      >

        <div style="text-align:right; line-height:1.3;">

          <div
            id="current-user-name"
            style="font-weight:600;"
          ></div>

          <div
            id="current-user-role"
            style="font-size:0.75rem; opacity:0.75;"
          ></div>

        </div>

        <button
          onclick="adminLogout()"
          class="btn btn-primary"
          style="padding:6px 15px; font-size:0.9rem;"
        >
          Logout
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       MAIN CONTENT
  ========================== -->

  <main class="container">

    <div class="admin-dashboard-layout">

      <!-- =========================
           SIDEBAR
      ========================== -->

      <aside class="admin-sidebar">

        <div id="admin-sidebar-menu-holder"></div>

      </aside>


      <!-- =========================
           ADMIN CONTENT
      ========================== -->

      <section class="admin-main">

        <h2 style="font-size:1.6rem; margin-bottom:5px;">
          Newsletter Subscribers
        </h2>

        <p
          style="
            color:var(--text-muted);
            margin-bottom:25px;
          "
        >
          Everyone who has signed up through the website's newsletter form.
        </p>


        <!-- =========================
             METRICS
        ========================== -->

        <div
          class="admin-metrics"
          style="
            grid-template-columns:repeat(2, 1fr);
            margin-bottom:25px;
          "
        >

          <div class="metric-card">

            <div>

              <div
                class="metric-value"
                id="metric-total-subs"
              >
                0
              </div>

              <div class="metric-label">
                Total Subscribers
              </div>

            </div>

          </div>


          <div class="metric-card">

            <div>

              <div
                class="metric-value"
                id="metric-month-subs"
                style="color:var(--ha-green);"
              >
                0
              </div>

              <div class="metric-label">
                New This Month
              </div>

            </div>

          </div>

        </div>


        <!-- =========================
             SEARCH
        ========================== -->

        <div class="admin-actions-bar">

          <div class="search-filters">

            <input
              type="text"
              id="search-input"
              class="form-control"
              placeholder="Search by email..."
            >

          </div>

        </div>


        <!-- =========================
             SUBSCRIBERS TABLE
        ========================== -->

        <div class="table-responsive">

          <table class="admin-table">

            <thead>

              <tr>
                <th>Email</th>
                <th>Registered Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>

            </thead>

            <tbody id="table-body">

              <tr>

                <td
                  colspan="4"
                  style="
                    text-align:center;
                    color:var(--text-muted);
                  "
                >
                  Loading subscribers...
                </td>

              </tr>

            </tbody>

          </table>

        </div>

      </section>

    </div>

  </main>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="../js/api.js"></script>
  <script src="../js/admin-common.js"></script>

<script src="../js/config.js"></script>
  <script>

    /*
     * IMPORTANT:
     * Your database permission is:
     *
     * manage_subscribers
     *
     * So this must match that permission.
     */

    const currentUser = AuthAPI.requirePermission(
      "manage_subscribers",
      "./dashboard.html"
    );


    let allSubs = [];


    // =========================
    // INITIALIZE PAGE
    // =========================

    (async function init() {

      if (!currentUser) {
        return;
      }

      renderAdminSidebar(
        currentUser,
        "subscribers.html"
      );


      try {

        await refresh();

      } catch (error) {

        console.error(
          "SUBSCRIBERS INIT ERROR:",
          error
        );

        const tbody =
          document.getElementById("table-body");

        tbody.innerHTML = `
          <tr>
            <td
              colspan="4"
              style="
                text-align:center;
                color:var(--ha-red);
              "
            >
              Failed to load subscribers.
            </td>
          </tr>
        `;

        if (window.showToast) {

          window.showToast(
            error.message ||
            "Failed to load subscribers.",
            "error"
          );

        }

      }


      document
        .getElementById("search-input")
        .addEventListener(
          "input",
          renderTable
        );

    })();


    // =========================
    // LOAD SUBSCRIBERS
    // =========================

    async function refresh() {

      allSubs =
        await SubscribersAPI.list();


      /*
       * Make sure we always have an array.
       */

      if (!Array.isArray(allSubs)) {

        allSubs = [];

      }


      // =========================
      // TOTAL SUBSCRIBERS
      // =========================

      document
        .getElementById("metric-total-subs")
        .innerText = allSubs.length;


      // =========================
      // NEW THIS MONTH
      // =========================

      const now = new Date();

      const thisMonth =
        allSubs.filter(subscriber => {

          const dateValue =
            subscriber.registeredDate;

          if (!dateValue) {
            return false;
          }

          const date =
            new Date(dateValue);

          return (
            date.getMonth() === now.getMonth() &&
            date.getFullYear() === now.getFullYear()
          );

        });


      document
        .getElementById("metric-month-subs")
        .innerText = thisMonth.length;


      // =========================
      // RENDER TABLE
      // =========================

      renderTable();

    }


    // =========================
    // RENDER TABLE
    // =========================

    function renderTable() {

      const searchInput =
        document.getElementById("search-input");

      const q =
        searchInput.value
          .trim()
          .toLowerCase();


      let subscribers =
        allSubs;


      // =========================
      // SEARCH BY EMAIL
      // =========================

      if (q) {

        subscribers =
          subscribers.filter(subscriber => {

            const email =
              subscriber.email || "";

            return email
              .toLowerCase()
              .includes(q);

          });

      }


      const tbody =
        document.getElementById("table-body");


      // =========================
      // NO RESULTS
      // =========================

      if (subscribers.length === 0) {

        tbody.innerHTML = `
          <tr>
            <td
              colspan="4"
              style="
                text-align:center;
                color:var(--text-muted);
              "
            >
              No subscribers found.
            </td>
          </tr>
        `;

        return;

      }


      // =========================
      // TABLE ROWS
      // =========================

      tbody.innerHTML =
        subscribers.map(subscriber => {

          const id =
            subscriber.id;

          const email =
            subscriber.email || "";

          const registeredDate =
            subscriber.registeredDate;


          let formattedDate = "—";


          if (registeredDate) {

            const date =
              new Date(registeredDate);


            if (!isNaN(date.getTime())) {

              formattedDate =
                date.toLocaleDateString(
                  "en-US",
                  {
                    month: "short",
                    day: "numeric",
                    year: "numeric"
                  }
                );

            }

          }


          const status =
            subscriber.status || "active";


          /*
           * Keep the existing status styling.
           */

          let statusClass =
            "status-published";


          if (
            status.toLowerCase() ===
            "unsubscribed"
          ) {

            statusClass =
              "status-draft";

          }


          return `

            <tr>

              <td>
                <strong>
                  ${escapeHtml(email)}
                </strong>
              </td>


              <td>
                ${formattedDate}
              </td>


              <td>

                <span
                  class="status-badge ${statusClass}"
                >
                  ${escapeHtml(status)}
                </span>

              </td>


              <td class="actions-cell">

                <button
                  class="action-btn delete"
                  onclick="removeSub('${id}')"
                  title="Remove"
                >
                  ${window.getIconSvg(
                    "trash",
                    "var(--ha-red)"
                  )}
                </button>

              </td>

            </tr>

          `;

        }).join("");

    }


    // =========================
    // REMOVE SUBSCRIBER
    // =========================

    window.removeSub =
      async function (id) {

        if (
          !confirm(
            "Remove this subscriber?"
          )
        ) {

          return;

        }


        try {

          await SubscribersAPI.remove(id);


          if (window.showToast) {

            window.showToast(
              "Subscriber removed.",
              "success"
            );

          }


          await refresh();

        } catch (error) {

          console.error(
            "REMOVE SUBSCRIBER ERROR:",
            error
          );


          if (window.showToast) {

            window.showToast(
              error.message ||
              "Failed to remove subscriber.",
              "error"
            );

          } else {

            alert(
              error.message ||
              "Failed to remove subscriber."
            );

          }

        }

      };


    // =========================
    // HTML ESCAPE
    // =========================

    function escapeHtml(value) {

      return String(value)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>

</html>
